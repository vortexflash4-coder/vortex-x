name: A0 verification

on:
  push:
    branches: [ 'codex/a0-verification-20261111' ]
    paths: [ 'a0/app/**', 'a0/gradle/**', 'a0/gradlew*', 'a0/*.gradle.kts', 'a0/gradle.properties', 'a0/.github/scripts/**', 'a0/.github/*-sha256.txt', '.github/workflows/a0-review.yml' ]
  workflow_dispatch:
    inputs:
      install_target:
        description: Fresh A0 install or data-preserving Phase 1 upgrade
        type: choice
        options: [fresh-install, phase1-upgrade]
        default: fresh-install

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: a0
    env:
      LOGS: ${{ github.workspace }}/ci-logs
      INSTALL_TARGET: ${{ inputs.install_target || 'fresh-install' }}
      VORTEX_DEBUG_STORE_PASSWORD: ${{ inputs.install_target == 'phase1-upgrade' && secrets.VORTEX_DEBUG_STORE_PASSWORD || 'android' }}
      VORTEX_DEBUG_KEY_PASSWORD: ${{ inputs.install_target == 'phase1-upgrade' && secrets.VORTEX_DEBUG_KEY_PASSWORD || 'android' }}
      VORTEX_DEBUG_KEY_ALIAS: ${{ inputs.install_target == 'phase1-upgrade' && secrets.VORTEX_DEBUG_KEY_ALIAS || 'androiddebugkey' }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare
        run: |
          chmod +x gradlew
          mkdir -p "$LOGS"

      # Each Gradle step keeps going on failure so the summary and logs are always
      # produced; the last step fails the run if a required step failed.
      # The GitHub-hosted Ubuntu image ships the Android SDK with licenses accepted;
      # AGP downloads any missing platform (android-36) automatically.
      - name: Test signing-target gates
        id: verifier
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/scripts/test-verify-apk.py 2>&1 | tee "$LOGS/0-signing-target-tests.log"

      - name: Restore original Phase 1 debug key when provided
        if: env.INSTALL_TARGET == 'phase1-upgrade'
        env:
          KEY_BASE64: ${{ secrets.VORTEX_PHASE1_DEBUG_KEYSTORE_BASE64 || secrets.VORTEX_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            umask 077
            printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/vortex-phase1-debug.keystore"
            echo "VORTEX_DEBUG_KEYSTORE=$RUNNER_TEMP/vortex-phase1-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "Original debug key unavailable. Build/test can run; phone-update signing gate will fail."
          fi

      - name: Build debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --stacktrace assembleDebug 2>&1 | tee "$LOGS/1-assembleDebug.log"

      - name: Run JVM unit tests
        id: unit
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          set +e
          ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee "$LOGS/2-testDebugUnitTest.log"
          gradle_result=${PIPESTATUS[0]}
          python3 .github/scripts/verify-jvm-reports.py 2>&1 | tee "$LOGS/jvm-gate.log"
          report_result=${PIPESTATUS[0]}
          if [ "$gradle_result" -ne 0 ] || [ "$report_result" -ne 0 ]; then exit 1; fi

      - name: Compile instrumentation tests
        id: androidtest
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --stacktrace assembleDebugAndroidTest 2>&1 | tee "$LOGS/3-assembleDebugAndroidTest.log"

      - name: Android lint (report only during Phase 1)
        id: lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew lintDebug 2>&1 | tee "$LOGS/4-lintDebug.log"

      - name: Verify APK signature, package and selected install target
        id: signing
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        working-directory: a0
        run: |
          set -o pipefail
          python3 .github/scripts/verify-apk.py --install-target "$INSTALL_TARGET" 2>&1 | tee "$LOGS/5-signing-gate.log"

      - name: Upload APK eligible for phone verification
        if: steps.verifier.outcome == 'success' && steps.assemble.outcome == 'success' && steps.unit.outcome == 'success' && steps.androidtest.outcome == 'success' && steps.signing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-a0-${{ env.INSTALL_TARGET }}-phone-test-apk
          path: a0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build-only APK when phone signing is blocked
        if: steps.verifier.outcome == 'success' && steps.assemble.outcome == 'success' && steps.unit.outcome == 'success' && steps.androidtest.outcome == 'success' && steps.signing.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-a0-BUILD-ONLY-NOT-PHONE-UPDATE
          path: a0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiled instrumentation APK (not execution evidence)
        if: steps.androidtest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-a0-androidtest-apk
          path: a0/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        if: always()
        env:
          ASSEMBLE: ${{ steps.assemble.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          ANDROIDTEST: ${{ steps.androidtest.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
          VERIFIER: ${{ steps.verifier.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: bash .github/scripts/ci-summary.sh "$GITHUB_WORKSPACE/a0" "$LOGS"

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-logs-and-reports
          path: |
            ci-logs/
            a0/app/build/reports/
            a0/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary debug signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vortex-phase1-debug.keystore"

      - name: Fail the run if a required step failed
        if: always()
        env:
          ASSEMBLE: ${{ steps.assemble.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          ANDROIDTEST: ${{ steps.androidtest.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
          VERIFIER: ${{ steps.verifier.outcome }}
        run: |
          echo "assembleDebug=$ASSEMBLE testDebugUnitTest=$UNIT assembleDebugAndroidTest=$ANDROIDTEST"
          if [ "$VERIFIER" != "success" ] || [ "$ASSEMBLE" != "success" ] || [ "$UNIT" != "success" ] || [ "$ANDROIDTEST" != "success" ] || [ "$SIGNING" != "success" ]; then
            echo "::error::A0 gate failed. Inspect build, JVM/allocation, instrumentation compile and signing results."
            exit 1
          fi

