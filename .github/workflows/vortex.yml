# VORTEX X phone build. Upload a project zip -> APK. Run workflow -> create-signing-key once.
# Each build also force-pushes its summary, logs and test reports to the branch ci-results
# (no APK, no keys), so the results can be read without screenshots.
name: VORTEX X build
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [build, create-signing-key]
        default: build
permissions:
  contents: write
concurrency:
  group: vx-${{ inputs.task || 'build' }}
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: ${{ inputs.task != 'create-signing-key' }}
        uses: gradle/actions/setup-gradle@v4
      - id: run
        env:
          TASK: ${{ inputs.task || 'build' }}
          KEY_B64: ${{ secrets.VORTEX_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ "$TASK" = create-signing-key ]; then
            k="$RUNNER_TEMP/k.p12"; mkdir -p key
            keytool -genkeypair -keystore "$k" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VORTEX X Debug,O=VORTEX X,C=IN"
            base64 -w 0 "$k" > key/VORTEX_DEBUG_KEYSTORE_B64.txt; rm -f "$k"
            echo "Key ready. Download artifact vortex-debug-key-secret, copy the text into the repository secret VORTEX_DEBUG_KEYSTORE_B64, then delete this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          zip="$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | head -n 1)"
          [ -n "$zip" ] || zip="$(git ls-files '*.zip' | head -n 1)"
          echo "Built from \`$zip\`" >> "$GITHUB_STEP_SUMMARY"
          unzip -q "$zip" -d _p
          d="$(dirname "$(find _p -maxdepth 4 -name gradlew | head -n 1)")"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          rc=0
          bash "$d/.github/scripts/ci-build.sh" "$d" "$PWD/ci-logs" || rc=$?
          mkdir -p ci-logs/tests
          cp "$GITHUB_STEP_SUMMARY" ci-logs/summary.md || true
          cp "$d"/app/build/test-results/testDebugUnitTest/*.xml ci-logs/tests/ 2>/dev/null || true
          exit $rc
      - if: ${{ always() && inputs.task == 'create-signing-key' }}
        uses: actions/upload-artifact@v4
        with:
          name: vortex-debug-key-secret
          path: key/
          retention-days: 1
      - if: ${{ always() && steps.run.outputs.assemble == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-debug-apk
          path: ${{ steps.run.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      - if: ${{ always() && steps.run.outputs.dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-logs-and-reports
          path: |
            ci-logs/
            ${{ steps.run.outputs.dir }}/app/build/reports/
            ${{ steps.run.outputs.dir }}/app/build/test-results/
          if-no-files-found: ignore
      - if: ${{ always() && steps.run.outputs.dir != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/res" && cp -r ci-logs/. "$RUNNER_TEMP/res/" && cd "$RUNNER_TEMP/res"
          git init -q && git add -A
          git -c user.name=vortex-ci -c user.email=vortex-ci@users.noreply.github.com commit -qm "CI run $RUN"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/ci-results
