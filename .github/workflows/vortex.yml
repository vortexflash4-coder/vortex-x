# VORTEX X phone build: upload a project zip -> debug APK.
# Signing: CI creates one debug key on the first build and keeps it in this repository's
# GitHub Actions cache (never committed, never printed). Every later APK is signed with
# the same key, so it installs over the previous one and keeps app data. A weekly run
# reads the cache so GitHub does not expire it.
# Each build also pushes its summary, logs and test reports to the branch ci-results
# (no APK, no key), so results can be read without screenshots.
name: VORTEX X build
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: write
concurrency:
  group: vx-${{ github.event_name == 'schedule' && 'keepalive' || 'build' }}
  cancel-in-progress: false
jobs:
  keepalive:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.vortex-key
          key: vortex-debug-key-v1
  run:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - id: keyrestore
        uses: actions/cache/restore@v4
        with:
          path: ~/.vortex-key
          key: vortex-debug-key-v1
      - id: keymake
        if: ${{ steps.keyrestore.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p ~/.vortex-key
          keytool -genkeypair -keystore ~/.vortex-key/vortex-debug.keystore -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VORTEX X Debug,O=VORTEX X,C=IN"
      - if: ${{ steps.keymake.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.vortex-key
          key: vortex-debug-key-v1
      - id: run
        env:
          NEW_KEY: ${{ steps.keymake.outcome == 'success' }}
        run: |
          key="$HOME/.vortex-key/vortex-debug.keystore"
          if keytool -list -keystore "$key" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            export VORTEX_DEBUG_KEYSTORE="$key" SIGNING=cached
            if [ "$NEW_KEY" = true ]; then
              echo "🔑 **Signing: new CI debug key created** and kept in the Actions cache (not in the repository). Uninstall the Phase 1 app once before installing this APK; from now on APKs install over each other and keep app data." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "🔑 **Signing: same CI debug key as before** (Actions cache). This APK installs over the previous one and keeps app data." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          zip="$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | head -n 1)"
          [ -n "$zip" ] || zip="$(git ls-files '*.zip' | head -n 1)"
          echo "Built from \`$zip\`" >> "$GITHUB_STEP_SUMMARY"
          unzip -q "$zip" -d _p
          d="$(dirname "$(find _p -maxdepth 4 -name gradlew | head -n 1)")"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          rc=0
          bash "$d/.github/scripts/ci-build.sh" "$d" "$PWD/ci-logs" || rc=$?
          mkdir -p ci-logs/tests
          cp "$GITHUB_STEP_SUMMARY" ci-logs/summary.md || true
          cp "$d"/app/build/test-results/testDebugUnitTest/*.xml ci-logs/tests/ 2>/dev/null || true
          exit $rc
      - if: ${{ always() && steps.run.outputs.assemble == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-debug-apk
          path: ${{ steps.run.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      - if: ${{ always() && steps.run.outputs.dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-logs-and-reports
          path: |
            ci-logs/
            ${{ steps.run.outputs.dir }}/app/build/reports/
            ${{ steps.run.outputs.dir }}/app/build/test-results/
          if-no-files-found: ignore
      - if: ${{ always() && steps.run.outputs.dir != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/res" && cp -r ci-logs/. "$RUNNER_TEMP/res/" && cd "$RUNNER_TEMP/res"
          git init -q && git add -A
          git -c user.name=vortex-ci -c user.email=vortex-ci@users.noreply.github.com commit -qm "CI run $RUN"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/ci-results
