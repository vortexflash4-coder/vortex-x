# VORTEX X — build the debug APK from a project ZIP uploaded to GitHub (phone-friendly).
#
# Use this when you cannot push the project folder (e.g. only a phone browser):
#   1. New GitHub repository → Actions → "set up a workflow yourself" →
#      paste this whole file → Commit.  (It is saved as .github/workflows/<name>.yml.)
#   2. Code → Add file → Upload files → pick VortexX-phase1.zip → Commit.
#   3. Actions tab → the "Build APK from uploaded zip" run starts by itself.
#      Green run: download the "vortex-x-debug-apk" artifact.
#      Red run: open the run → Summary → the "Errors" box shows file:line.
# Uploading a new zip starts a new build. "Run workflow" re-builds the latest zip.

name: Build APK from uploaded zip

on:
  push:
    paths: [ '**.zip' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-from-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOGS: ${{ github.workspace }}/ci-logs
      VORTEX_DEBUG_STORE_PASSWORD: ${{ secrets.VORTEX_DEBUG_STORE_PASSWORD || 'android' }}
      VORTEX_DEBUG_KEY_PASSWORD: ${{ secrets.VORTEX_DEBUG_KEY_PASSWORD || 'android' }}
      VORTEX_DEBUG_KEY_ALIAS: ${{ secrets.VORTEX_DEBUG_KEY_ALIAS || 'androiddebugkey' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack the project zip
        id: unpack
        run: |
          set -euo pipefail
          # The zip changed by the latest commit, otherwise the newest tracked zip.
          zip="$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | head -n 1)"
          if [ -z "$zip" ]; then
            zip="$(git ls-files '*.zip' | head -n 1)"
          fi
          if [ -z "$zip" ]; then
            echo "::error::No .zip file found in the repository. Upload the project zip first."
            exit 1
          fi
          echo "Using $zip"
          rm -rf _project && mkdir _project
          unzip -q "$zip" -d _project
          gradlew="$(find _project -maxdepth 4 -type f -name gradlew | head -n 1)"
          if [ -z "$gradlew" ]; then
            echo "::error::$zip does not contain a Gradle project (no gradlew found)."
            exit 1
          fi
          dir="$(dirname "$gradlew")"
          chmod +x "$gradlew"
          mkdir -p "$LOGS"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore original Phase 1 debug key when provided
        env:
          KEY_BASE64: ${{ secrets.VORTEX_PHASE1_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            umask 077
            printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/vortex-phase1-debug.keystore"
            echo "VORTEX_DEBUG_KEYSTORE=$RUNNER_TEMP/vortex-phase1-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "Original debug key unavailable. Build/test can run; phone-update signing gate will fail."
          fi

      - name: Build debug APK
        id: assemble
        continue-on-error: true
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: |
          set -o pipefail
          ./gradlew --stacktrace assembleDebug 2>&1 | tee "$LOGS/1-assembleDebug.log"

      - name: Run JVM unit tests
        id: unit
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: |
          set -o pipefail
          set +e
          ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee "$LOGS/2-testDebugUnitTest.log"
          gradle_result=${PIPESTATUS[0]}
          python3 .github/scripts/verify-jvm-reports.py 2>&1 | tee "$LOGS/jvm-gate.log"
          report_result=${PIPESTATUS[0]}
          if [ "$gradle_result" -ne 0 ] || [ "$report_result" -ne 0 ]; then exit 1; fi

      - name: Compile instrumentation tests
        id: androidtest
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: |
          set -o pipefail
          ./gradlew --stacktrace assembleDebugAndroidTest 2>&1 | tee "$LOGS/3-assembleDebugAndroidTest.log"

      - name: Verify package and Phase 1 signing compatibility
        id: signing
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: |
          set -o pipefail
          python3 .github/scripts/verify-apk.py 2>&1 | tee "$LOGS/5-signing-gate.log"

      - name: Upload APK eligible for phone verification
        if: steps.assemble.outcome == 'success' && steps.unit.outcome == 'success' && steps.androidtest.outcome == 'success' && steps.signing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-a0-phone-candidate-apk
          path: ${{ steps.unpack.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiled instrumentation APK (not execution evidence)
        if: steps.androidtest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-a0-androidtest-apk
          path: ${{ steps.unpack.outputs.dir }}/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        if: always() && steps.unpack.outcome == 'success'
        env:
          ASSEMBLE: ${{ steps.assemble.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          ANDROIDTEST: ${{ steps.androidtest.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
          LINT: skipped
          DIR: ${{ steps.unpack.outputs.dir }}
          ZIP: ${{ steps.unpack.outputs.zip }}
        run: |
          echo "Built from \`$ZIP\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$DIR/.github/scripts/ci-summary.sh" ]; then
            bash "$DIR/.github/scripts/ci-summary.sh" "$DIR" "$LOGS"
          else
            echo "ci-summary.sh is missing from this zip; open the step logs for errors." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs and reports
        if: always() && steps.unpack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-x-logs-and-reports
          path: |
            ci-logs/
            ${{ steps.unpack.outputs.dir }}/app/build/reports/
            ${{ steps.unpack.outputs.dir }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary debug signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vortex-phase1-debug.keystore"

      - name: Fail the run if a required step failed
        if: always()
        env:
          UNPACK: ${{ steps.unpack.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          ANDROIDTEST: ${{ steps.androidtest.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
        run: |
          echo "unpack=$UNPACK assembleDebug=$ASSEMBLE testDebugUnitTest=$UNIT assembleDebugAndroidTest=$ANDROIDTEST"
          if [ "$UNPACK" != "success" ] || [ "$ASSEMBLE" != "success" ] || [ "$UNIT" != "success" ] || [ "$ANDROIDTEST" != "success" ] || [ "$SIGNING" != "success" ]; then
            echo "::error::A0 gate failed. Inspect build, JVM/allocation, instrumentation compile and signing results."
            exit 1
          fi
